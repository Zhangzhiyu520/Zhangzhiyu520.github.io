<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>我的个人主页</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{
            background:#1a1a2e;
            color:#fff;
            font-family:system-ui,sans-serif;
            min-height:100vh;
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
        }
        .box{
            text-align:center;
            padding:40px;
            border-radius:16px;
            background:rgba(255,255,255,0.08);
            backdrop-filter:blur(10px);
        }
        h1{
            font-size:42px;
            margin-bottom:16px;
            color:#7cf;
        }
        p{
            font-size:18px;
            opacity:0.85;
            line-height:1.8;
        }
        .btn{
            display:inline-block;
            margin-top:24px;
            padding:12px 30px;
            background:#409eff;
            color:white;
            text-decoration:none;
            border-radius:999px;
            transition:0.3s;
        }
        .btn:hover{
            background:#2b7cd3;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>你好👋</h1>
        <p>欢迎来到我的Github个人主页</p>
        <p>网站地址：zhangzhiyu520.github.io</p>
        <a class="btn" href="#">欢迎访问</a>
    </div>
</body>
</html>
